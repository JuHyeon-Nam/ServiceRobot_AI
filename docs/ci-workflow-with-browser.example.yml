name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: src
        env:
          PYTHONUTF8: "1"
        run: python -m pytest ../tests -q

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install runtime and browser
        run: |
          pip install -r requirements-server.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify UI workflows and WebGL
        env:
          CHROME_CHANNEL: chromium
          TWIN_URL: http://127.0.0.1:8765
          TWIN_SCREENSHOTS: /tmp/servicerobot-ui
        run: |
          python -m uvicorn realtime_server:app --app-dir src --host 127.0.0.1 --port 8765 > /tmp/twin-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for i in $(seq 1 30); do
            curl -sf "$TWIN_URL/api/demo" && break
            sleep 1
          done
          npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: twin-ui-verification
          path: |
            /tmp/servicerobot-ui
            /tmp/twin-server.log

  # C2: Docker 패키징 검증 — 로컬에 docker가 없어도 CI가 매 push마다
  # 이미지 빌드 + 컨테이너 기동 + 관제/데이터API/메트릭 스모크 테스트로 보증한다.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t servicerobot-ai .

      - name: Smoke test (server boots, endpoints respond)
        run: |
          docker run -d --rm -p 8000:8000 --name twin servicerobot-ai
          ok=0
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/snapshot >/dev/null && ok=1 && break
            sleep 1
          done
          [ "$ok" = "1" ] || { echo "server did not boot"; docker logs twin; exit 1; }
          curl -sf http://127.0.0.1:8000/twin | grep -q "디지털 트윈"
          curl -sf http://127.0.0.1:8000/assets/twin_workspace.png > /dev/null
          curl -sf http://127.0.0.1:8000/api/trend | grep -q "\["
          curl -sf http://127.0.0.1:8000/metrics | grep -q "fab_agv_total"
          docker stop twin
